app = "telegram-job-bot"
primary_region = "sin"

[build]

[env]
  PYTHONIOENCODING = "utf-8"
  PYTHONUNBUFFERED = "1"
  TIMEZONE = "Asia/Ho_Chi_Minh"
  DB_PATH = "/data/jobs.db"

# Background worker — không cần HTTP port
[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

[mounts]
  source = "bot_data"
  destination = "/data"
