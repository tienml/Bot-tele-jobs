name: Deploy to Fly.io

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Tạo app nếu chưa có
        run: flyctl apps create telegram-job-bot --machines 2>/dev/null || true
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Tạo volume lưu database nếu chưa có
        run: flyctl volumes create bot_data --size 1 --region sin --app telegram-job-bot 2>/dev/null || true
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Cập nhật secrets
        run: flyctl secrets set BOT_TOKEN=${{ secrets.BOT_TOKEN }} --app telegram-job-bot
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Deploy
        run: flyctl deploy --remote-only --app telegram-job-bot
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
