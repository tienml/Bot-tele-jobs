name: Gửi tin tuyển dụng hàng ngày

on:
  schedule:
    # 8:00 sáng giờ Việt Nam = 1:00 UTC
    - cron: '0 1 * * *'
  # Cho phép chạy thủ công để test
  workflow_dispatch:

jobs:
  send-jobs:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # cần để commit jobs.db và docs/ ngược lại repo

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Cài Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Cài dependencies
        run: pip install -r requirements.txt

      - name: Gửi tin tuyển dụng
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_IDS: ${{ secrets.CHAT_IDS }}
          PYTHONIOENCODING: utf-8
        run: python run_once.py

      - name: Lưu jobs.db + trang thống kê vào repo
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # jobs.db giữ lịch sử "đã gửi"; docs/ là trang GitHub Pages.
          git add jobs.db docs
          # Chỉ commit nếu có thay đổi thật
          git diff --cached --quiet || git commit -m "chore: cập nhật tin tuyển dụng [skip ci]"
          git pull --rebase origin main
          git push origin main
